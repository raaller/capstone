test_cases:
  - input:
      name: "x86 Jcc default preserves JO rel16 and its legacy target"
      bytes: [0x66, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL]
      address: 0
    expected:
      insns:
        - asm_text: "jo 0xfffffffffffffad3"
          size: 5
          details:
            x86:
              enc_imm_offset: 3
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: -1325
                  size: 4
        - asm_text: "movsd dword ptr [rdi], dword ptr [rsi]"
          size: 1
  - input:
      name: "x86 Jcc default preserves JB rel32"
      bytes: [0x66, 0x0f, 0x82, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_OPT_X86_JCC_DEFAULT]
      address: 0
    expected:
      insns:
        - asm_text: "jb 0xffffffffd8a5fad5"
          size: 7
          details:
            x86:
              enc_imm_size: 4
              operands:
                - type: X86_OP_IMM
                  imm: -660210987
                  size: 4
  - input:
      name: "x86 AMD JO truncates target and retains the following move"
      bytes: [0x66, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_OPT_X86_JCC_AMD]
      address: 0x123450000
    expected:
      insns:
        - asm_text: "jo 0xfad3"
          size: 5
          details:
            x86:
              enc_imm_offset: 3
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 0xfad3
                  size: 2
        - asm_text: "movsd dword ptr [rdi], dword ptr [rsi]"
          size: 1
  - input:
      name: "x86 AMD JNO in AT&T syntax retains movsl"
      bytes: [0x66, 0x0f, 0x81, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_OPT_X86_JCC_AMD, CS_OPT_SYNTAX_ATT]
      address: 0
    expected:
      insns:
        - asm_text: "jno 0xfad3"
          size: 5
          details:
            x86:
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 0xfad3
                  size: 2
        - asm_text: "movsl (%rsi), (%rdi)"
          size: 1
  - input:
      name: "x86 AMD JB also consumes rel16"
      bytes: [0x66, 0x0f, 0x82, 0x01, 0x00]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_OPT_X86_JCC_AMD]
      address: 0xfffe
    expected:
      insns:
        - asm_text: "jb 4"
          size: 5
          details:
            x86:
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 4
                  size: 2
  - input:
      name: "x86 AMD near Jcc with effective REX.W consumes rel32"
      bytes: [0x66, 0x48, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_OPT_X86_JCC_AMD]
      address: 0
    expected:
      insns:
        - asm_text: "jo 0xffffffffd8a5fad6"
          size: 8
          details:
            x86:
              enc_imm_offset: 4
              enc_imm_size: 4
              operands:
                - type: X86_OP_IMM
                  imm: -660210986
                  size: 8
